<!doctype html><html lang="zh"><meta charset="utf-8"><title>主题构图性能验收</title><style>body{font:16px system-ui;padding:24px;background:#f5f6ef}pre{white-space:pre-wrap}img{width:256px}</style><h1>主题构图性能验收</h1><p id="status">正在运行：纯浏览器渲染，不调用 AI。</p><img id="sample"><pre id="report"></pre><script type="module">
import {renderLocal} from '../src/render/client.ts';import {resolveCompositions,applyComposition} from '../src/themes/plans.ts';import {applyTemplatePlan} from '../src/local/plans.ts';import {makePlan} from '../src/api.ts';
const started=performance.now(),c=await fetch('/library/catalog.json').then(r=>r.json());for(const a of c.assets){a.url=new URL('/'+a.url,location.origin).href;if(a.poster_url)a.poster_url=new URL('/'+a.poster_url,location.origin).href}for(const f of c.fonts)f.url=new URL('/'+f.url,location.origin).href;
const load=performance.now()-started,samples=resolveCompositions(c),rows=[],summary={},percentile=(v,p)=>[...v].sort((a,b)=>a-b)[Math.min(v.length-1,Math.ceil(v.length*p)-1)],record=(name,values)=>summary[name]={samples:values.length,median_ms:Math.round(percentile(values,.5)*10)/10,p95_ms:Math.round(percentile(values,.95)*10)/10};
async function run(name,plans,thumbnail=false){const times=[];for(let i=0;i<plans.length;i++){document.querySelector('#status').textContent=name+' '+(i+1)+'/'+plans.length;const start=performance.now(),r=await renderLocal(c,plans[i],undefined,thumbnail);times.push(performance.now()-start);rows.push({name,ms:times.at(-1),cache_hit:r.info.cache_hit,frames:r.info.frames});document.querySelector('#sample').src=r.url}record(name,times)}
const a=c.assets.find(a=>a.id==='meowl-cutout')||c.assets.find(a=>a.character==='Meowl'&&a.info.has_transparency),legacy={...makePlan(a),size:256,text:'今天，一起去上课。'};
await run('theme_jpg_cold',[{...samples[7].plan,size:256,format:'jpg'}]);await run('legacy_jpg_same_session',[legacy]);await run('theme_jpg_edit',Array.from({length:10},(_,i)=>({...samples[7].plan,size:256,format:'jpg',text:'提交失败 '+i})));await run('theme_gif_edit',Array.from({length:5},(_,i)=>({...samples[7].plan,size:256,format:'gif',text:'再试一次 '+i})));
const warm={...samples[0].plan,size:256,format:'jpg'};await run('thumbnail_first',[warm],true);await run('thumbnail_hot',Array(20).fill(warm),true);
const multi=applyComposition(c,'groupwork-story',applyTemplatePlan(c,'scene',makePlan(a),6));await run('six_actor_gif',Array.from({length:3},(_,i)=>({...multi,size:256,format:'gif',text:'集体缓一缓 '+i})));
const concurrent=[];for(let n=0;n<3;n++){const background=Promise.all(samples.slice(n*4,n*4+4).map(v=>renderLocal(c,{...v.plan,size:256,format:'jpg'},undefined,true)));const start=performance.now();await renderLocal(c,{...samples[0].plan,size:256,format:'jpg',text:'同时浏览 '+n});concurrent.push(performance.now()-start);await background}record('edit_while_browsing',concurrent);
const results={kind:'actual-browser-worker-end-to-end',catalog_load_ms:load,user_agent:navigator.userAgent,baseline_note:'legacy_jpg_same_session measures the retained legacy path after theme startup in this build; it is not a historical before/after measurement.',summary,rows};document.querySelector('#report').textContent=JSON.stringify(results,null,2);document.querySelector('#status').textContent='完成；未读取或发送 AI 设置。';
</script></html>
